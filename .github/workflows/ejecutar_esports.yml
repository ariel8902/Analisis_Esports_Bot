name: Ejecutar Bot de eSports

on:
  schedule:
    # 13:30 UTC equivale a las 08:30 AM Hora Colombia (UTC-5)
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  analisis_esports:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic requests

      - name: Ejecutar motor eSports
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          TELEGRAM_TOKEN_ESPORTS: ${{ secrets.TELEGRAM_TOKEN_ESPORTS }}
          TELEGRAM_CHAT_ID_ESPORTS: ${{ secrets.TELEGRAM_CHAT_ID_ESPORTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analisis_esports_prepartido.py
