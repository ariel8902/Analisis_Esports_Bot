name: Bot de Analisis eSports Prepartido

on:
  schedule:
    # 13:12 UTC -> 08:12 AM Hora Colombia
    # 01:12 UTC -> 08:12 PM Hora Colombia (Cubre madrugada)
    - cron: '12 13,1 * * *'
  workflow_dispatch:

jobs:
  analisis_esports:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pydantic

      - name: Ejecutar motor eSports
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: python analisis_esports_prepartido.py
