name: Bot de Analisis eSports Prepartido

on:
  schedule:
    # 13:00 UTC equivale exactamente a las 08:00 AM Hora Colombia (UTC-5)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  analisis_esports:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic

- name: Ejecutar motor eSports
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        PANDASCORE_API_KEY: ${{ secrets.PANDASCORE_TOKEN }}
      run: python analisis_esports_prepartido.py
